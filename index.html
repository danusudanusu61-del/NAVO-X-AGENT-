<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVOX AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { background-color: #0b0f19; color: #f8fafc; width: 100%; height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        .app-header {
            padding: 14px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #131b2e;
            color: #38bdf8;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .app-info h1 { font-size: 1rem; font-weight: 600; color: #f8fafc; letter-spacing: 0.5px; }
        .app-info p { font-size: 0.7rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 24px 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-box {
            width: 64px;
            height: 64px;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #38bdf8;
            font-size: 1.8rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            margin-bottom: 4px;
        }

        .welcome-card h2 { font-size: 1.3rem; color: #f8fafc; font-weight: 600; }
        .welcome-card .tagline { font-size: 0.8rem; color: #38bdf8; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; margin-top: -6px; }
        .welcome-card p { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; }

        .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .chip {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { background: #2563eb; border-color: #2563eb; }

        .message { display: flex; gap: 10px; max-width: 100%; width: 100%; }
        .message.user { flex-direction: row-reverse; }
        .message-content {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #f8fafc;
            max-width: 85%;
            line-height: 1.4;
        }
        .message.user .message-content { background-color: #2563eb; border: none; }

        .chat-input-area {
            padding: 14px 16px 20px 16px;
            background-color: #0b0f19;
            border-top: 1px solid #1e293b;
        }

        .input-wrapper {
            background-color: #131b2e;
            border: 1px solid #334155;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            resize: none;
            max-height: 100px;
            outline: none;
            line-height: 1.4;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-logo"><i class="fa-solid fa-hexagon-nodes"></i></div>
        <div class="app-info">
            <h1>NAVOX</h1>
            <p>AI Agent</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="welcome-card" id="welcomeCard">
            <div class="brand-logo-box"><i class="fa-solid fa-hexagon-nodes"></i></div>
            <h2>NAVOX</h2>
            <div class="tagline">think. plan. act.</div>
            <p>ఏం ఓపెన్ చేయాలి? కింద ఉన్న బటన్స్ మీద క్లిక్ చేయి లేదా నేరుగా టైప్ చేయి.</p>
            <div class="chips">
                <div class="chip" onclick="runCommand('open instagram')">Instagram</div>
                <div class="chip" onclick="runCommand('open telegram')">Telegram</div>
                <div class="chip" onclick="runCommand('open freefire')">Free Fire</div>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask NAVOX or type command..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const welcomeCard = document.getElementById('welcomeCard');

        function runCommand(text) {
            userInput.value = text;
            handleSend();
        }

        function addMessage(text, sender) {
            if (welcomeCard) welcomeCard.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function openApp(uri, storeUrl, name) {
            addMessage(`Opening ${name}...`, 'bot');
            window.location.href = uri;
            setTimeout(() => {
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = uri;
                document.body.appendChild(iframe);
                setTimeout(() => document.body.removeChild(iframe), 500);
            }, 500);
        }

        function processCommand(text) {
            let l = text.toLowerCase();
            if (l.includes('instagram')) openApp("instagram://", "https://play.google.com/store/apps/details?id=com.instagram.android", "Instagram");
            else if (l.includes('telegram')) openApp("tg://", "https://play.google.com/store/apps/details?id=org.telegram.messenger", "Telegram");
            else if (l.includes('free fire') || l.includes('freefire')) openApp("freefireth://", "https://play.google.com/store/apps/details?id=com.dts.freefireth", "Free Fire");
            else if (l.includes('whatsapp')) openApp("whatsapp://", "https://play.google.com/store/apps/details?id=com.whatsapp", "WhatsApp");
            else if (l.includes('youtube')) openApp("vnd.youtube://", "https://play.google.com/store/apps/details?id=com.google.android.youtube", "YouTube");
            else {
                addMessage(`Searching for: "${text}"`, 'bot');
                setTimeout(() => window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, "_blank"), 500);
            }
        }

        function handleSend() {
            let text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            processCommand(text);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });
    </script>
</body>
</html>
